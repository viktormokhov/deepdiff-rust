[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "deepdiff-rust"
version = "0.1.4"
description = "Rust-backed DeepDiff-compatible comparison for Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "viktormokhov", email = "110980778+viktormokhov@users.noreply.github.com" },
]
keywords = ["deepdiff", "diff", "rust", "performance", "comparison"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
[project.urls]
Homepage = "https://github.com/viktormokhov/deepdiff-rust"
Repository = "https://github.com/viktormokhov/deepdiff-rust"
Issues = "https://github.com/viktormokhov/deepdiff-rust/issues"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "deepdiff==9.1.0",
]

[tool.maturin]
manifest-path = "crates/deepdiff-python/Cargo.toml"
python-source = "python"
module-name = "deepdiff_rust._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
