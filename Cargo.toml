[workspace]
resolver = "2"
members = [
    "crates/deepdiff-core",
    "crates/deepdiff-python",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/viktormokhov/deepdiff-rust"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
