[package]
name = "deepdiff-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Core structural-diff engine with DeepDiff-compatible reports"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
serde = "1"
serde_json = "1"
unicode-general-category = "1.1"
# Arbitrary-precision integers (a Python `int` outside i64/u64 range). Pinned
# to the same 0.5 line arrow-buffer already resolves in this workspace, so no
# second copy enters the tree.
num-bigint = "0.5"
num-traits = "0.2"

[dev-dependencies]
proptest = "1"
stats_alloc = "0.1"
