[package]
name = "deepdiff-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust-backed DeepDiff-compatible Python extension"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
onix-core = { path = "../../vendor/onix/crates/onix-core" }
pyo3 = { version = "0.29", features = ["abi3-py39"] }
serde_json = "1"
num-bigint = "0.5"

[features]
extension-module = ["pyo3/extension-module"]
